<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard AI - URL Security Scanner</title>
    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .scan-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px;
        }
        .scan-input {
            font-size: 1.1rem;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: border-color 0.3s;
        }
        .scan-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .scan-btn {
            font-size: 1.2rem;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: transform 0.2s;
        }
        .scan-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        #result {
            margin-top: 30px;
        }
        .alert {
            border-radius: 10px;
            border: none;
        }
        .footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="header">
            <h1>🛡️ PhishGuard AI</h1>
            <p>Threat Intelligence Powered URL Security Scanner</p>
        </div>

        <div class="scan-card">
            <h3 class="mb-4">Scan URL for Threats</h3>
            
            <input
                type="text"
                id="url"
                class="form-control scan-input"
                placeholder="Enter URL (e.g., https://example.com)"
                aria-label="URL to scan">

            <button
                onclick="scanURL()"
                class="btn btn-primary scan-btn w-100 mt-3">
                🔍 Scan URL
            </button>

            <div id="result"></div>
        </div>

        <div class="footer">
            <p>Powered by VirusTotal API & Machine Learning</p>
            <p><small>© 2026 PhishGuard AI. All rights reserved.</small></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
